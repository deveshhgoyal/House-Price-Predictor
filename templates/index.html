<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Price Predictor</title>

    <!-- Load external CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>🏡 House Price Prediction</h2>

        <form action="/predict" method="POST">
            <label>Median Income</label>
            <input type="number" step="0.0001" name="MedInc" min="0.0001" required placeholder="e.g. 4.5">

            <label>Avg House Age</label>
            <input type="number" step="0.1" name="HouseAge" min="1" required placeholder="e.g. 30">

            <label>Average Rooms</label>
            <input type="number" step="0.01" name="AveRooms" min="0.1" required placeholder="e.g. 5">

            <label>Average Bedrooms</label>
            <input type="number" step="0.01" name="AveBedrms" min="0.1" required placeholder="e.g. 2">

            <label>Average Population</label>
            <input type="number" step="1" name="Population" min="1" required placeholder="e.g. 800">

            <label>Average Occupancy</label>
            <input type="number" step="0.01" name="AveOccup" min="0.1" required placeholder="e.g. 5">


            <label for="County">County</label>
            <select id="County" name="County" required aria-label="County">
                <option value="">-- Select County --</option>
                {% for county in counties %}
                    <option value="{{ county }}">{{ county }}</option>
                {% endfor %}
            </select>

            <button type="submit">Predict Price</button>
        </form>

        {% if result %}
        <div class="result-box">
            Predicted Price: <br><span class="res">💲{{ result }}</span>
        </div>
        {% endif %}
    </div>
</body>
</html>
